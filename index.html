/* Layout: one player stage (16:9) with an overlay layer, a control rail beneath, and a slim progress card. Single committed look: Skills Bank navy. */
:root {
  --navy: #080828; --navy-2: #11113f; --navy-3: #1b1b5c; --line: rgba(235,244,255,.14);
  --gold: #FFBC3A; --gold-ink: #2a1d00; --ice: #EBF4FF; --muted: #a9b4d6; --ok: #40BDA9; --bad: #F26444; --blue: #4D88E8;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--navy); color: var(--ice); }
body { font-family: var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .logo { height: 34px; width: auto; flex: none; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4vw, 40px); letter-spacing: .5px; margin: 0; line-height: 1; text-wrap: balance; }
h1 em { color: var(--gold); font-style: normal; }
.tag { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

/* stage */
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: 14px; overflow: hidden; container-type: inline-size; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
.stage video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage:fullscreen { border-radius: 0; }
.cap { position: absolute; left: 50%; bottom: 4.5cqw; transform: translateX(-50%); max-width: 62%; text-align: center; font-weight: 700; font-size: clamp(12px, 2.1cqw, 30px); line-height: 1.3; color: #fff; background: rgba(8,8,40,.78); padding: .25em .6em; border-radius: 6px; pointer-events: none; }
.hot { position: absolute; right: 1.4cqw; bottom: 1.5cqw; display: flex; align-items: center; gap: .45em; font: 600 clamp(10px, 1.2cqw, 17px)/1 var(--body); color: var(--gold-ink); background: var(--gold); border: 2px solid #fff; border-radius: 999px; padding: .55em .95em .55em .55em; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: pulse 1.6s ease-in-out infinite; }
.hot .plus { display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--navy); color: var(--gold); font-size: 1.1em; }
.hot:focus-visible, button:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,188,58,.55), 0 8px 24px rgba(0,0,0,.4); } 50% { box-shadow: 0 0 0 12px rgba(255,188,58,0), 0 8px 24px rgba(0,0,0,.4); } }
.start { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, rgba(35,35,122,.72), rgba(8,8,40,.94)); text-align: center; padding: 4cqw; }
.start-inner { display: grid; gap: 1.6cqw; justify-items: center; }
.start h2 { font: 400 clamp(24px, 6cqw, 84px)/1 var(--display); margin: 0; }
.start h2 em { color: var(--gold); font-style: normal; }
.start p { margin: 0; color: var(--muted); font-size: clamp(12px, 1.7cqw, 20px); }
.chips { display: flex; gap: .6em; flex-wrap: wrap; justify-content: center; }
.chip { font: 700 clamp(10px, 1.3cqw, 15px)/1 var(--mono); letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: .55em .9em; color: var(--ice); }
.big-play { font: 700 clamp(14px, 2cqw, 24px)/1 var(--body); background: var(--gold); color: var(--gold-ink); border: 0; border-radius: 999px; padding: .9em 1.8em; cursor: pointer; display: inline-flex; gap: .6em; align-items: center; }

/* controls */
.rail { display: grid; grid-template-columns: auto 1fr auto auto auto; align-items: center; gap: 12px; background: var(--navy-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }

.ib[aria-pressed="true"] { background: var(--navy-3); border-color: var(--gold); color: var(--gold); }
.time { font: 700 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { position: relative; height: 34px; cursor: pointer; min-width: 0; touch-action: none; user-select: none; }
.bar .knob { position: absolute; top: 10px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(242,180,0,.45); pointer-events: none; left: 0; }
.buf { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; border: 5px solid rgba(255,255,255,.25); border-top-color: var(--gold); animation: spin .8s linear infinite; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar .track { position: absolute; left: 0; right: 0; top: 15px; height: 5px; border-radius: 3px; background: rgba(235,244,255,.16); }
.bar .fill { position: absolute; left: 0; top: 15px; height: 5px; border-radius: 3px; background: var(--gold); width: 0; }
.bar .chap { position: absolute; top: 12px; width: 2px; height: 11px; background: rgba(235,244,255,.35); }
.mk { position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; border: 2px solid var(--navy-2); cursor: pointer; padding: 0; }
.mk.ex { background: var(--gold); }
.mk.q { background: var(--ice); border-radius: 3px; transform: rotate(45deg) scale(.82); }
.mk.q.done-ok { background: var(--ok); } .mk.q.done-bad { background: var(--bad); }
.mk.ex.seen { background: transparent; border: 2px solid var(--gold); }
.status { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
.status b { color: var(--ice); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); vertical-align: middle; margin-right: 6px; }
.dia { display: inline-block; width: 9px; height: 9px; background: var(--ice); transform: rotate(45deg); vertical-align: middle; margin-right: 7px; }
.chapname { font: 700 12px var(--mono); letter-spacing: 1px; color: var(--gold); text-transform: uppercase; }

/* layers (fixed so they work in fullscreen and on phones) */
.layer { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(5,5,24,.72); backdrop-filter: blur(3px); overflow: auto; }
.panel { width: min(760px, 100%); max-height: calc(100% - 8px); overflow: auto; background: var(--navy-2); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 30px 70px rgba(0,0,0,.55); }
.panel-head { padding: 20px 24px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.kicker { font: 600 12px var(--body); letter-spacing: 1.6px; color: var(--gold); text-transform: uppercase; }
.panel h3 { font: 400 clamp(24px, 4vw, 34px)/1.05 var(--display); margin: 0; letter-spacing: .3px; text-wrap: balance; }
.panel-body { padding: 18px 24px; display: grid; gap: 12px; }
.ex-card { background: var(--navy); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.ex-card .lab { font: 600 12px var(--body); letter-spacing: 1.2px; color: var(--gold); text-transform: uppercase; }
.ex-card p { margin: 0; line-height: 1.55; font-size: 15.5px; }
.ex-card .prompt { font: 400 16px/1.55 var(--body); color: var(--ice); background: rgba(235,244,255,.05); border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; padding: 10px 14px; }
.ex-card .prompt::before { content: "\201C"; color: var(--gold); font-weight: 700; margin-right: 2px; } .ex-card .prompt::after { content: "\201D"; color: var(--gold); font-weight: 700; margin-left: 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.weak .lab { color: var(--bad); } .strong .lab { color: var(--ok); }
.tip { font-size: 13px; color: var(--muted); border-left: 3px solid var(--gold); padding-left: 10px; }
.panel-foot { padding: 14px 24px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); }
.btn { font: 700 15px/1 var(--body); border-radius: 999px; padding: 13px 22px; cursor: pointer; border: 2px solid transparent; }
.btn.primary { background: var(--gold); color: var(--gold-ink); }
.btn.ghost { background: transparent; color: var(--ice); border-color: var(--line); }
.countdown { flex: 1 1 160px; min-width: 0; display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
.countdown .cd-track { height: 4px; background: rgba(235,244,255,.12); border-radius: 2px; overflow: hidden; }
.countdown .cd-fill { height: 100%; background: var(--gold); width: 100%; }

/* quiz */
.opts { display: grid; gap: 10px; }
.opt { text-align: left; font: 600 16px/1.4 var(--body); color: var(--ice); background: var(--navy); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.opt .k { font: 700 13px var(--mono); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--navy-3); color: var(--gold); }
.opt:hover:not([disabled]) { border-color: var(--gold); }
.opt.right { border-color: var(--ok); background: rgba(64,189,169,.12); }
.opt.wrong { border-color: var(--bad); background: rgba(242,100,68,.12); }
.opt[disabled] { cursor: default; }
.feedback { border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; line-height: 1.5; }
.feedback.ok { background: rgba(64,189,169,.14); border: 1px solid var(--ok); }
.feedback.bad { background: rgba(242,100,68,.12); border: 1px solid var(--bad); }
.feedback strong { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .4px; }
.feedback.ok strong { color: var(--ok); } .feedback.bad strong { color: var(--bad); }
.shake { animation: shake .42s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { 0% { transform: scale(.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
canvas.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
.score { font: 400 clamp(54px, 10vw, 96px)/1 var(--display); color: var(--gold); }
.result-row { display: flex; gap: 10px; flex-wrap: wrap; }
.result-row span { font: 700 12px var(--mono); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
.result-row .r-ok { color: var(--ok); border-color: var(--ok); } .result-row .r-bad { color: var(--bad); border-color: var(--bad); }
footer { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.rotate-tip { display: none; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--muted); }
/* phone portrait: compact chrome so the video gets the space */
@media (max-width: 640px) {
  body { padding-left: 10px; padding-right: 10px; padding-block: 10px 18px; }
  .wrap { gap: 10px; }
  .brand .logo { height: 24px; } h1 { font-size: 24px; } .tag { font-size: 9px; letter-spacing: 1.4px; }
  .chapname { font-size: 11px; }
  .stage { border-radius: 10px; }

  .rail .ib { height: 34px; min-width: 34px; padding: 0 8px; }

  .mk { width: 12px; height: 12px; margin-left: -6px; top: 11px; border-width: 1.5px; }
  .status .legend { display: none; }

}
/* phone landscape, full screen, or theatre mode: video first */
@media (orientation: landscape) and (max-height: 520px) {

   header,  .status,  footer { display: none; }
   .wrap { max-width: none; gap: 6px; }
   .stage { width: min(100%, calc((100dvh - 62px) * 16 / 9)); margin-inline: auto; border-radius: 6px; }

}

/* series additions: XP counter, journey of modules, badge shelf, certificate */
.xpbox { display: flex; align-items: baseline; gap: 6px; background: var(--navy-2); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; }
.xp-num { font: 400 28px/1 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: right; }

.journey { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mod { position: relative; text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; background: var(--navy-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--ice); cursor: pointer; font: inherit; min-width: 0; }

.mod[aria-current="true"] .num { background: var(--gold); color: var(--gold-ink); }

.mod.done .s { color: var(--ok); }
.mod[disabled] { cursor: not-allowed; opacity: .5; }

.modtitle { font: 600 13px var(--body); color: var(--muted); }

.linkbtn { background: none; border: 0; color: var(--muted); font: 600 12px var(--body); text-decoration: underline; cursor: pointer; padding: 4px; }

.bdg.cert { cursor: pointer; }
.hint { font-size: 14.5px; color: var(--ice); }

.big-badge { display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 14px; background: rgba(255,188,58,.08); border: 1px solid rgba(255,188,58,.4); }
.big-badge .medal { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold) 60%, #c98a10); font: 400 30px var(--display); color: var(--gold-ink); flex: none; }

html[lang="ar"] { --body: "IBM Plex Sans Arabic", "IBM Plex Sans", "Segoe UI", Tahoma, Arial, sans-serif; --mono: "IBM Plex Sans Arabic", "IBM Plex Sans", Tahoma, Arial, sans-serif; --display: "Cairo", "Anton", Tahoma, sans-serif; }
html[lang="ar"] .tag, html[lang="ar"] .chip, html[lang="ar"] .kicker { letter-spacing: 0; text-transform: none; }
html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] .feedback strong, html[lang="ar"] .start h2 { font-weight: 800; line-height: 1.25; }
h1.prog { font-family: "Anton", Impact, sans-serif !important; font-weight: 400 !important; direction: ltr; unicode-bidi: isolate; }
.hright { display: flex; align-items: center; gap: 10px; }
.langbtn { font: 700 14px/1 var(--body); color: var(--navy, #0c0c3a); background: var(--gold, #FFBC3A); border: 2px solid #fff; border-radius: 999px; padding: 10px 16px; cursor: pointer; min-height: 40px; }
.langbtn #langLab { font-family: "IBM Plex Sans Arabic", "IBM Plex Sans", Arial, sans-serif; }
.bar, .time { direction: ltr; }
[dir="rtl"] .hot { right: auto; left: 1.4cqw; padding: .55em .55em .55em .95em; }
[dir="rtl"] .mod, [dir="rtl"] .opt { text-align: right; }
[dir="rtl"] .dot, [dir="rtl"] .dia { margin-right: 0; margin-left: 7px; }
[dir="rtl"] .tip { border-left: 0; padding-left: 0; border-right: 3px solid var(--gold); padding-right: 10px; }
[dir="rtl"] .xp-num { text-align: left; }
.mod.soon { opacity: .55; }
.shelf-btns { display: inline-flex; gap: 14px; flex-wrap: wrap; }
.panel.wide { max-width: 720px; }
.field .row { display: flex; gap: 10px; flex-wrap: wrap; } .field .row input { flex: 1 1 220px; }
.lb-head { display: flex; flex-direction: column; gap: 2px; margin: 18px 0 8px; } .lb-head span { font-size: 13px; color: var(--muted); }
.lb { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 300px; overflow: auto; }
.lb li { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 10px; background: rgba(235,244,255,.05); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.lb .rk { font: 400 22px/1 "Anton", Impact, sans-serif; color: var(--muted); text-align: center; }
.lb .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .lb .nm em { font-style: normal; color: var(--gold); font-weight: 600; }
.lb .pt { font: 400 20px/1 "Anton", Impact, sans-serif; color: var(--gold); direction: ltr; }
.lb li.top1 .rk { color: #FFBC3A; } .lb li.top2 .rk { color: #dfe6f3; } .lb li.top3 .rk { color: #d79a5a; }
.lb li.me { border-color: var(--gold); background: rgba(255,188,58,.10); }
.rail { direction: ltr; }
#qScore, #exCount, .xp-num { direction: ltr; unicode-bidi: isolate; }
h1.prog { white-space: nowrap; }
footer span:first-child { direction: ltr; unicode-bidi: isolate; }
@media (max-width: 480px) { h1.prog { font-size: 24px; } .langbtn { padding: 8px 12px; font-size: 13px; min-height: 36px; } }
.wrap { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 640px) { h1.prog { font-size: 21px; } .hright { gap: 6px; } .brand { gap: 8px; } .xp-lab { display: none; } }
</style>

const DATA = {"modules": [{"n": 1, "title": {"en": "Self-Regulation", "ar": "التنظيم الذاتي"}, "badge": {"en": "Calm Under Fire", "ar": "هادي تحت الضغط"}, "medal": "1", "soon": false, "v": {"en": {"src": "media/Self_Regulation_EN.mp4", "duration": 205.7, "scenes": [{"id": "brand", "s": 0.0, "e": 2.0}, {"id": "hook", "s": 2.0, "e": 23.0}, {"id": "define", "s": 23.0, "e": 43.5}, {"id": "goal", "s": 43.5, "e": 61.1}, {"id": "aware", "s": 61.1, "e": 81.77}, {"id": "triggers", "s": 81.77, "e": 115.73}, {"id": "own", "s": 115.73, "e": 138.07}, {"id": "stop", "s": 138.07, "e": 170.87}, {"id": "replay", "s": 170.87, "e": 187.93}, {"id": "close", "s": 187.93, "e": 200.7}], "cues": [{"s": 0.0, "e": 1.81, "t": "A Skills Bank original."}, {"s": 2.46, "e": 6.2, "t": "It's a Monday meeting, and a client says your report is wrong."}, {"s": 6.48, "e": 8.31, "t": "In front of your whole team."}, {"s": 8.87, "e": 11.75, "t": "Your face gets hot. Your heart races."}, {"s": 11.8, "e": 16.31, "t": "And before you can think, you've already answered... a little too sharply."}, {"s": 17.05, "e": 22.81, "t": "That moment, between what you feel and what you do, is where self-regulation lives."}, {"s": 23.46, "e": 31.27, "t": "Self-management, or self-regulation, is the ability to manage your actions, thoughts and feelings,"}, {"s": 31.18, "e": 32.73, "t": "in flexible ways, to get the results you want."}, {"s": 33.27, "e": 36.01, "t": "When it works well, it builds three things."}, {"s": 36.43, "e": 40.93, "t": "A sense of wellbeing. A sense of self-efficacy, or confidence."}, {"s": 41.21, "e": 43.28, "t": "And a sense of connection to others."}, {"s": 43.96, "e": 47.77, "t": "The goal is to treat your emotional responses as cues."}, {"s": 48.08, "e": 51.78, "t": "Cues for action, and for coping well in your relationships."}, {"s": 52.37, "e": 57.06, "t": "Anger can tell you a line was crossed. Worry can tell you something matters."}, {"s": 57.47, "e": 60.93, "t": "But to read the cue, you first need self-awareness."}, {"s": 61.58, "e": 66.63, "t": "Self-awareness means being aware of both our mood, and our thoughts about that mood."}, {"s": 67.04, "e": 72.77, "t": "It's the ability to read and understand your emotions, and to recognise their impact on others."}, {"s": 73.16, "e": 75.02, "t": "Not just: I'm angry."}, {"s": 75.18, "e": 81.59, "t": "But: I'm angry, I think he's disrespecting me, and my tone is making the whole room tense."}, {"s": 82.23, "e": 84.41, "t": "Then come emotional triggers."}, {"s": 84.82, "e": 91.53, "t": "Triggers often arise from the five senses: what you see, hear, smell, taste and touch."}, {"s": 92.09, "e": 98.91, "t": "A trigger can also be a memory or an experience that sets off a powerful reaction, whatever your mood is right now."}, {"s": 99.59, "e": 102.71, "t": "To find a trigger, look at the situation around you."}, {"s": 103.15, "e": 109.96, "t": "If you feel an intense reaction every time you go to the same doctor's office, the trigger may be the office itself."}, {"s": 110.45, "e": 115.56, "t": "At work, it might be a certain tone in a meeting, or one name in your inbox."}, {"s": 116.21, "e": 119.52, "t": "Recognising your triggers is also a responsibility."}, {"s": 119.92, "e": 124.73, "t": "Triggers explain a reaction. They are not an excuse for the behaviour."}, {"s": 125.38, "e": 127.94, "t": "Our reactions are survival responses."}, {"s": 128.32, "e": 133.57, "t": "Understanding them helps you be more understanding, even forgiving, of your own missteps..."}, {"s": 133.9, "e": 137.9, "t": "and then responsible enough to change the unconscious response."}, {"s": 138.53, "e": 140.54, "t": "So what do you do in the hot moment?"}, {"s": 140.99, "e": 142.86, "t": "Use the STOP practice."}, {"s": 143.51, "e": 149.66, "t": "S: stop. Pause, set it down, look away, disengage."}, {"s": 150.29, "e": 155.47, "t": "T: take a breath. Feel the full cycle of breathing in your body."}, {"s": 156.22, "e": 163.96, "t": "O: observe. First the sensations in your body, then your thoughts and emotions. Be curious."}, {"s": 164.66, "e": 170.51, "t": "P: proceed. Ask: what feels like a wise next step, now?"}, {"s": 171.32, "e": 172.84, "t": "Back to that Monday meeting."}, {"s": 173.2, "e": 176.97, "t": "Stop: you don't answer yet. Take a breath."}, {"s": 177.61, "e": 181.9, "t": "Observe: my face is hot, and I'm thinking he's attacking me."}, {"s": 182.67, "e": 188.37, "t": "Proceed: Thank you for flagging it. Let me check the numbers, and I'll come back to you within the hour."}, {"s": 188.39, "e": 191.05, "t": "Self-regulation, in four moves."}, {"s": 191.43, "e": 197.32, "t": "Know your mood, and your thoughts about it. Spot your triggers. Own your response."}, {"s": 197.5, "e": 199.96, "t": "And when it gets hot... STOP."}], "chapters": [{"t": 2.0, "n": "Monday, 10 AM"}, {"t": 23.0, "n": "What it is"}, {"t": 43.5, "n": "Emotions are cues"}, {"t": 61.1, "n": "Self-awareness"}, {"t": 81.77, "n": "Emotional triggers"}, {"t": 115.73, "n": "Your responsibility"}, {"t": 138.07, "n": "The STOP practice"}, {"t": 170.87, "n": "Back to Monday"}, {"t": 187.93, "n": "Recap"}], "hot": {"e1": [82.53, 115.33], "e2": [61.87, 81.37], "e3": [138.83, 170.47]}, "examples": {"e1": {"label": "Examples: Triggers at work", "title": "Triggers at work", "body": "<div class=\"ex-card\"><p>Hearing: a manager&#x27;s sharp tone in front of the team.</p></div><div class=\"ex-card\"><p>Seeing: one client&#x27;s name in your inbox before you open the email.</p></div><div class=\"ex-card\"><p>Memory: a review meeting that reminds you of a bad appraisal years ago.</p></div>"}, "e2": {"label": "Examples: Mood vs thoughts about the mood", "title": "Mood vs thoughts about the mood", "body": "<div class=\"ex-card\"><p>Mood: &#x27;I&#x27;m tense.&#x27;</p></div><div class=\"ex-card\"><p>Thought about it: &#x27;If I&#x27;m tense, I&#x27;ll mess up this presentation.&#x27;</p></div><div class=\"ex-card\"><p>Impact: &#x27;My short answers are making my team stop asking questions.&#x27;</p></div>"}, "e3": {"label": "Examples: STOP in 30 seconds", "title": "STOP in 30 seconds", "body": "<div class=\"ex-card\"><p>S: put the phone face down before replying to an angry email.</p></div><div class=\"ex-card\"><p>T: one slow breath, in and out.</p></div><div class=\"ex-card\"><p>O: &#x27;Shoulders tight, I&#x27;m thinking he&#x27;s blaming me.&#x27;</p></div><div class=\"ex-card\"><p>P: &#x27;I&#x27;ll reply after lunch, with the facts.&#x27;</p></div>"}}, "quiz": [{"t": 60.75, "q": "A colleague criticises your plan in a meeting and you feel your face get hot. What does self-regulation ask of you first?", "o": ["Hide the feeling and smile", "Leave the meeting", "Treat the feeling as a cue, and pause before you respond", "Answer quickly so you don't look weak"], "a": 2, "why": "Self-regulation treats emotional responses as cues for action, not something to hide or obey.", "hint": "Is the feeling something to hide, obey, or read?", "id": "q1"}, {"t": 115.38, "q": "You feel a strong reaction every Sunday at the weekly review. How do you find the trigger?", "o": ["Ignore it; it will pass", "Look at the situation around you: what you see, hear, and what it reminds you of", "Assume it's your mood that day", "Ask HR to cancel the meeting"], "a": 1, "why": "To identify a trigger, look at the situation around you; a reaction that repeats in the same place points to it.", "hint": "Where does the reaction keep happening?", "id": "q2"}, {"t": 137.72, "q": "Mona says: 'I shouted because that client always triggers me.' What is the best response?", "o": ["'It's fine, everyone shouts.'", "'Then avoid that client.'", "'Triggers aren't real.'", "'A trigger explains the reaction, but you still own the behaviour. What could you do next time?'"], "a": 3, "why": "Triggers explain a reaction; they are not an excuse. Recognising them is also a responsibility.", "hint": "Does a trigger explain the reaction, or excuse it?"   st.ended = true; const firstTime = !S.done; const v = V(M);
  v.quiz.forEach((q) => { if (S.answered[q.id] === undefined) S.answered[q.id] = 0; });
  if (firstTime) { S.done = true; gainXP(XP.finish); }
  save(); renderJourney(); renderBadges(); buildMarks(); scoreLine();
  const right = Object.values(S.answered).filter((x) => x > 0).length, total = v.quiz.length;
  const nextI = AV.find((k) => k > cur); const last = allDone();
  st.modal = "end";
  layer.innerHTML = `<div class="panel pop" role="dialog" aria-modal="true" aria-labelledby="rTitle">
    <div class="panel-head"><span class="kicker">${T().video} ${M.n} ${T().complete}${firstTime ? " · " + xpt(XP.finish) : ""}</span><h3 id="rTitle">${esc(M.title[LANG])}: ${right === total ? T().allRight : right >= total - 1 ? T().strong : T().another}</h3></div>
    <div class="panel-body">
      <div class="big-badge"><span class="medal">${M.medal}</span><div><b>${esc(M.badge[LANG])}</b><span>${firstTime ? T().unlocked : T().already}</span></div></div>
      <div class="score"><bdi dir="ltr">${right} / ${total}</bdi></div>
      <div class="result-row">${v.quiz.map((q, i) => { const r = S.answered[q.id]; return `<span class="${r > 0 ? "r-ok" : "r-bad"}"><bdi>${i + 1} ${r === 2 ? "✓" : r === 1 ? "✓✓" : "✕"}</bdi></span>`; }).join("")}</div>
      <p>${T().exOpened(Object.keys(S.seen).length, Object.keys(v.hot).length)}</p>
      <p class="tip">${T().total}: <b>${xpt(P.xp, false)}</b>.${nextI !== undefined && !last ? T().nextUnlocked : ""}</p></div>
    <div class="panel-foot">
      ${last ? `<button class="btn primary" id="finalGo" type="button">${T().finalBtn}</button>` : nextI !== undefined ? `<button class="btn primary" id="nextBtn" type="button">${T().next}: ${esc(MODS[nextI].title[LANG])}</button>` : ""}
      <button class="btn ghost" id="again" type="button">${T().again}</button></div></div>`;
  layer.hidden = false; confetti(); chime(true);
  if ($("nextBtn")) $("nextBtn").addEventListener("click", () => { closeLayer(); loadModule(nextI, true); });
  if ($("finalGo")) $("finalGo").addEventListener("click", () => showFinal(false));
  $("again").addEventListener("click", restart);
}
function restart() { closeLayer(); st.ended = false; st.lastT = 0; st.resumeAt = null; vid.currentTime = 0; play(); }

/* ---------- final screen: name, leaderboard (this device), certificate ---------- */
function boardHTML() {
  const rows = [...BOARD].sort((a, b) => b.xp - a.xp || a.t - b.t);
  if (!rows.length) return `<p class="tip">${T().noBoard}</p>`;
  const me = (P.name || "").trim().toLowerCase();
  return `<ol class="lb">${rows.map((r, i) => `<li class="${r.name.trim().toLowerCase() === me ? "me" : ""}${i < 3 ? " top" + (i + 1) : ""}"><span class="rk">${i + 1}</span><span class="nm">${esc(r.name)}${r.name.trim().toLowerCase() === me ? ` <em>· ${T().you}</em>` : ""}</span><span class="pt">${r.xp} XP</span></li>`).join("")}</ol>`;
}
function record(name) {
  const k = name.trim().toLowerCase(); const i = BOARD.findIndex((r) => r.name.trim().toLowerCase() === k);
  const row = { name: name.trim(), xp: P.xp, t: Date.now() };
  if (i >= 0) { if (P.xp >= BOARD[i].xp) BOARD[i] = row; } else BOARD.push(row);
  save();
}
function showFinal(onlyBoard) {
  pause(); st.modal = onlyBoard ? "board" : "final";
  const done = allDone();
  layer.innerHTML = `<div class="panel pop wide" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <div class="panel-head"><span class="kicker">${done ? T().finalK + " · " + xpt(P.xp, false) : T().board}</span><h3 id="fTitle">${done && !onlyBoard ? T().finalH : T().board}</h3></div>
    <div class="panel-body">
      ${done && !onlyBoard ? `<form id="nameForm" class="field"><label for="pName">${T().nameL}</label><div class="row"><input id="pName" maxlength="40" autocomplete="name" value="${esc(P.name || "")}" required><button class="btn primary" type="submit">${T().save}</button></div></form>` : ""}
      <div class="lb-head">${onlyBoard ? "" : `<b>${T().board}</b>`}<span>${T().boardNote}</span></div>
      <div id="lbOut">${boardHTML()}</div>
      <div id="certOut"></div></div>
    <div class="panel-foot">
      ${done && !onlyBoard ? `<button class="btn ghost" id="certMake" type="button">${T().makeCert}</button><a class="btn ghost" id="certSave" hidden download="Skills-Bank-Alpha-Leader-certificate.png">${T().dl}</a>` : ""}
      ${done ? `<button class="btn ghost" id="newP" type="button">${T().newP}</button>` : ""}
      <button class="btn ghost" id="fClose" type="button">${T().close}</button></div></div>`;
  layer.hidden = false;
  $("fClose").addEventListener("click", closeLayer);
  if ($("nameForm")) {
    $("pName").focus();
    $("nameForm").addEventListener("submit", (e) => { e.preventDefault(); const n = $("pName").value.trim(); if (!n) return; P.name = n; record(n); $("lbOut").innerHTML = boardHTML(); confetti(); chime(true); });
    $("certMake").addEventListener("click", () => { const n = $("pName").value.trim(); if (!n) { $("pName").focus(); return; } P.name = n; record(n); $("lbOut").innerHTML = boardHTML();
      const url = drawCert(n).toDataURL("image/png"); $("certOut").innerHTML = `<img class="cert-img" alt="" src="${url}">`; $("certSave").href = url; $("certSave").hidden = false; confetti(); chime(true); });
  }
  if ($("newP")) $("newP").addEventListener("click", () => { P = blank(); save(); $("xpNum").textContent = 0; closeLayer(); loadModule(AV[0], true); });
}
$("boardBtn").addEventListener("click", () => { if (!st.modal) showFinal(true); });

function drawCert(name) {
  const ar = LANG === "ar"; const c = document.createElement("canvas"); c.width = 1600; c.height = 1130; const x = c.getContext("2d");
  const AF = "'IBM Plex Sans Arabic', 'IBM Plex Sans', Arial", HF = ar ? "'Cairo', Arial" : "Anton, Impact, sans-serif";
  const g = x.createRadialGradient(800, 420, 100, 800, 560, 1000); g.addColorStop(0, "#23237a"); g.addColorStop(1, "#080828"); x.fillStyle = g; x.fillRect(0, 0, 1600, 1130);
  x.strokeStyle = "#FFBC3A"; x.lineWidth = 6; x.strokeRect(40, 40, 1520, 1050); x.lineWidth = 1.5; x.strokeRect(58, 58, 1484, 1014);
  x.textAlign = "center"; x.direction = ar ? "rtl" : "ltr";
  x.fillStyle = "#FFBC3A"; x.font = `600 26px ${AF}`; x.fillText(T().certTop, 800, 170);
  x.fillStyle = "#EBF4FF"; x.font = "400 104px Anton, Impact, sans-serif"; x.direction = "ltr"; x.fillText("Alpha Leader", 800, 310); x.direction = ar ? "rtl" : "ltr";
  x.font = `500 30px ${AF}`; x.fillStyle = "#a9b4d6"; x.fillText(T().certLine1, 800, 450);
  x.fillStyle = "#FFFFFF"; x.font = `${ar ? 800 : 400} 92px ${HF}`; x.fillText(name, 800, 575);
  x.fillStyle = "#FFBC3A"; x.fillRect(500, 615, 600, 5);
  x.fillStyle = "#EBF4FF"; x.font = `500 30px ${AF}`; x.fillText(T().certLine2(P.xp), 800, 690);
  const show = AV; show.forEach((i, k) => { const m = MODS[i]; const cx = 800 + (k - (show.length - 1) / 2) * 300; x.beginPath(); x.arc(cx, 840, 58, 0, Math.PI * 2); x.fillStyle = "#FFBC3A"; x.fill(); x.lineWidth = 6; x.strokeStyle = "#fff"; x.stroke();
    x.fillStyle = "#2a1d00"; x.font = "400 44px Anton, Impact, sans-serif"; x.fillText(m.medal, cx, 856); x.fillStyle = "#EBF4FF"; x.font = `600 24px ${AF}`; x.fillText(m.badge[LANG], cx, 940); });
  x.fillStyle = "#a9b4d6"; x.font = `500 22px ${AF}`; x.direction = "ltr";
  x.fillText(new Date().toLocaleDateString(ar ? "ar-EG" : "en-GB", { day: "numeric", month: "long", year: "numeric" }) + " · © 2026 Skills Bank", 800, 1045);
  return c;
}

$("resetBtn").addEventListener("click", () => {
  if (st.modal) return; st.modal = "reset";
  layer.innerHTML = `<div class="panel pop" role="dialog" aria-modal="true" aria-labelledby="zTitle"><div class="panel-head"><span class="kicker">${T().reset}</span><h3 id="zTitle">${T().resetQ}</h3></div>
    <div class="panel-body"><p class="tip">${T().resetNote}</p></div>
    <div class="panel-foot"><button class="btn primary" id="zYes" type="button">${T().resetYes}</button><button class="btn ghost" id="zNo" type="button">${T().resetNo}</button></div></div>`;
  layer.hidden = false; $("zNo").focus();
  $("zNo").addEventListener("click", closeLayer);
  $("zYes").addEventListener("click", () => { P = blank(); save(); $("xpNum").textContent = 0; closeLayer(); loadModule(AV[0], true); });
});

/* ---------- celebration ---------- */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("confetti"); c.hidden = false; const x = c.getContext("2d"); const W = (c.width = innerWidth * devicePixelRatio), H = (c.height = innerHeight * devicePixelRatio);
  const cols = ["#FFBC3A", "#EBF4FF", "#40BDA9", "#4D88E8", "#F26444"];
  const Pt = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .45, vx: (Math.random() - .5) * 22 * devicePixelRatio, vy: (-Math.random() * 20 - 8) * devicePixelRatio, s: (6 + Math.random() * 7) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  let f = 0; (function step() { x.clearRect(0, 0, W, H); Pt.forEach((p) => { p.vy += .55 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++f < 150) requestAnimationFrame(step); else { x.clearRect(0, 0, W, H); c.hidden = true; } })();
}
let AC = null; function unlockAudio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch (e) {} }
function chime(good) {
  if (!AC) return; const t0 = AC.currentTime; const notes = good ? [523.25, 659.25, 783.99, 1046.5] : [311.13, 233.08];
  notes.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = good ? "triangle" : "sine"; o.frequency.value = f; const s = t0 + i * (good ? .09 : .16);
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(.18, s + .02); g.gain.exponentialRampToValueAtTime(.001, s + (good ? .5 : .35)); o.connect(g).connect(AC.destination); o.start(s); o.stop(s + .6); });
}

/* ---------- boot ---------- */
applyLang(); $("xpNum").textContent = P.xp;
(() => {
  const m = /^#video-([1-9])$/.exec(location.hash); let i = m ? +m[1] - 1 : P.mods.findIndex((x, k) => !x.done && !MODS[k].soon);
  if (i < 0 || i >= MODS.length || !unlocked(i)) i = AV.find((k) => unlocked(k) && !P.mods[k].done); if (i === undefined) i = AV[0];
  loadModule(i, false);
})();

</script>
